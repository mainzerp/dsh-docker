services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-dsh-v0.1.2-alpha.4}
        GH_VERSION: ${GH_VERSION:-2.97.0}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.1}
        UV_VERSION: ${UV_VERSION:-0.12.5}
    image: dsh-docker:latest
    container_name: dsh
    ports:
      - "3080:3080"
    environment:
      # Runtime variables, passed through from the shell or .env when set.
      # List syntax: a variable set in neither place is omitted entirely —
      # never injected as an empty string that would shadow file-based
      # credentials or git identities.
      # --- DeepSeek Harness ---
      - DEEPSEEK_API_KEY
      - DEEPSEEK_BASE_URL
      - DSH_MODEL
      - DSH_SYSTEM_PROMPT
      # --- Additional model providers (referenced via apiKeyEnv) ---
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      # --- WebUI / LAN access ---
      - TRUSTED_HOSTS
      - DSH_TELEMETRY_DISABLED
      # --- GitHub / Git ---
      - GH_TOKEN
      - GITHUB_TOKEN
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
    env_file:
      - path: .env
        required: false
    volumes:
      - dsh-data:/data
      # The WebUI creates workspaces under the agent's home directory, so the
      # home directory itself is the volume: workspaces, gh auth, .gitconfig
      # and caches all survive container recreation.
      - dsh-home:/home/node
    restart: unless-stopped
    init: true
    shm_size: 1gb

volumes:
  dsh-data:
  dsh-home:
