services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.5-rc.2}
        GH_VERSION: ${GH_VERSION:-2.97.0}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.1}
        UV_VERSION: ${UV_VERSION:-0.12.5}
    image: dsh-docker:latest
    container_name: dsh
    ports:
      - "3080:3080"
    environment:
      # Runtime variables, passed through from the shell or .env when set.
      # Map syntax with null values: a variable set in neither place is omitted
      # entirely — never injected as an empty string that would shadow file-based
      # credentials or git identities.
      # --- DeepSeek Harness ---
      DEEPSEEK_API_KEY:
      DEEPSEEK_BASE_URL:
      DSH_MODEL:
      DSH_SYSTEM_PROMPT:
      # --- Additional model providers (referenced via apiKeyEnv) ---
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      # --- WebUI / LAN access ---
      TRUSTED_HOSTS:
      DSH_TELEMETRY_DISABLED:
      # Reverse-proxy auth trust (patches/trusted-proxy-auth.mjs): with
      # DSH_TRUST_REVERSE_PROXY_AUTH truthy (1/true/yes/on) the image skips
      # dsh's own browser-session gate, so the reverse proxy is the only
      # authentication and the printed token URL is no longer needed. Set
      # DSH_PROXY_AUTH_SECRET as well to require the proxy-injected
      # `x-dsh-proxy-auth` header instead of trusting the network path.
      # See README "Auth behind an authenticating reverse proxy".
      DSH_TRUST_REVERSE_PROXY_AUTH:
      DSH_PROXY_AUTH_SECRET:
      # --- GitHub / Git ---
      GH_TOKEN:
      GITHUB_TOKEN:
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      # --- Node/V8 runtime ---
      # Measured 2026-09-10 on this deployment: with Node's default heap ceiling
      # (4288 MB) the process parks at the limit and runs an emergency
      # stop-the-world full GC about once a minute, freezing the whole web event
      # loop for 10-12 s (every HTTP request, agent loop and WebSocket stalls).
      # Raising the ceiling lets V8 mark incrementally instead. See README
      # "Server memory and GC stalls". Override from the shell/.env if needed.
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=8192}"
      # --- Outbound network proxy ---
      # Honored by dsh 0.1.5 for its outbound requests; pnpm (`dsh plugin`), gh
      # and git inside the container use them too. Unrelated to the reverse-proxy
      # auth above. A variable set in neither the shell nor .env stays omitted
      # entirely, exactly like every other entry in this map.
      HTTP_PROXY:
      HTTPS_PROXY:
      ALL_PROXY:
      NO_PROXY:
    env_file:
      - path: .env
        required: false
    volumes:
      - dsh-data:/data
      # The WebUI creates workspaces under the agent's home directory, so the
      # home directory itself is the volume: workspaces, gh auth, .gitconfig
      # and caches all survive container recreation.
      - dsh-home:/home/node
    restart: unless-stopped
    init: true
    shm_size: 1gb
    # --- GPU passthrough (host Intel iGPU) ---
    # Headless Chromium (Playwright) renders on the iGPU instead of SwiftShader
    # once the DRM devices are visible and the image's Mesa/Vulkan userspace can
    # open them. Measured on the deployment host 2026-09-10: card0 is
    # root:video 0660 (video = GID 44, identical on Debian and Ubuntu) and
    # renderD128 is root:render 0660 - the upstream udev default of 0666 does not
    # apply there, so the render GID has to be granted explicitly. Without it the
    # Intel Vulkan/GL driver fails with
    # "Unable to open device /dev/dri/renderD128: Permission denied".
    # Look the GID up on the host: stat -c '%g' /dev/dri/renderD128
    # (override via RENDER_GID in .env; 109 on the reference host).
    # Needs a host with /dev/dri: on a host without it, `docker compose up` fails
    # with "error gathering device information".
    # Verify inside the container: node scripts/gpu-check.mjs
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
      # Docker resolves group names against the image's /etc/group, which has no
      # "render" group, so the render node's group must be passed numerically.
      - "${RENDER_GID:-109}"

volumes:
  dsh-data:
  dsh-home:
