# Uses the prebuilt image from GHCR instead of building locally.
# Start: docker compose -f compose.prebuilt.yaml up -d
# Version pinning happens via the image tag (e.g. ghcr.io/mainzerp/dsh-docker:0.1
# or the dsh-build tags ghcr.io/mainzerp/dsh-docker:dsh-0.1.2-alpha.4),
# not via DSH_VERSION build args — those only apply to the local build in compose.yaml.
services:
  dsh:
    image: ghcr.io/mainzerp/dsh-docker:latest
    container_name: dsh
    ports:
      - "3080:3080"
    environment:
      # Runtime variables, passed through from the shell or .env when set.
      # List syntax: a variable set in neither place is omitted entirely —
      # never injected as an empty string that would shadow file-based
      # credentials or git identities.
      # --- DeepSeek Harness ---
      - DEEPSEEK_API_KEY
      - DEEPSEEK_BASE_URL
      - DSH_MODEL
      - DSH_SYSTEM_PROMPT
      # --- Additional model providers (referenced via apiKeyEnv) ---
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      # --- WebUI / LAN access ---
      - TRUSTED_HOSTS
      - DSH_TELEMETRY_DISABLED
      # --- GitHub / Git ---
      - GH_TOKEN
      - GITHUB_TOKEN
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
    env_file:
      - path: .env
        required: false
    volumes:
      - dsh-data:/data
      # The WebUI creates workspaces under the agent's home directory, so the
      # home directory itself is the volume: workspaces, gh auth, .gitconfig
      # and caches all survive container recreation.
      - dsh-home:/home/node
    restart: unless-stopped
    init: true
    shm_size: 1gb

volumes:
  dsh-data:
  dsh-home:
