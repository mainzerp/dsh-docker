# Uses the prebuilt image from GHCR instead of building locally.
# Start: docker compose -f compose.prebuilt.yaml up -d
# Version pinning happens via the image tag (e.g. ghcr.io/mainzerp/dsh-docker:0.1),
# not via DSH_VERSION build args — those only apply to the local build in compose.yaml.
services:
  dsh:
    image: ghcr.io/mainzerp/dsh-docker:latest
    container_name: dsh
    ports:
      - "3080:3080"
    environment:
      # Runtime variables, passed through from the shell or .env when set.
      # Map syntax with null values: a variable set in neither place is omitted
      # entirely — never injected as an empty string that would shadow file-based
      # credentials or git identities.
      # --- DeepSeek Harness ---
      DEEPSEEK_API_KEY:
      DEEPSEEK_BASE_URL:
      DSH_MODEL:
      DSH_SYSTEM_PROMPT:
      # --- Additional model providers (referenced via apiKeyEnv) ---
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      # --- WebUI / LAN access ---
      TRUSTED_HOSTS:
      DSH_TELEMETRY_DISABLED:
      # --- GitHub / Git ---
      GH_TOKEN:
      GITHUB_TOKEN:
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      # --- Node/V8 runtime ---
      # Measured 2026-09-10: with Node's default heap ceiling (4288 MB) the
      # single dsh web process parks at the limit and runs an emergency
      # stop-the-world full GC about once a minute, freezing the whole web event
      # loop for 10-12 s. See README "Server memory and GC stalls".
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=8192}"
    env_file:
      - path: .env
        required: false
    volumes:
      - dsh-data:/data
      # The WebUI creates workspaces under the agent's home directory, so the
      # home directory itself is the volume: workspaces, gh auth, .gitconfig
      # and caches all survive container recreation.
      - dsh-home:/home/node
    restart: unless-stopped
    init: true
    shm_size: 1gb
    # --- GPU passthrough (host Intel iGPU) ---
    # Headless Chromium (Playwright) renders on the iGPU instead of SwiftShader
    # once the DRM devices are visible and the image's Mesa/Vulkan userspace can
    # open them. The systemd udev rule creates renderD* world-accessible (0666),
    # but card0 is root:video 0660, hence the "video" group — GID 44 on Debian
    # and Ubuntu. Needs a host with /dev/dri: on a host without it,
    # `docker compose up` fails with "error gathering device information".
    # If the host's video group uses another GID, or the render node is not 0666
    # (check on the host: stat -c '%a %g' /dev/dri/*), use the numeric GID here.
    # Verify inside the container: node scripts/gpu-check.mjs
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video

volumes:
  dsh-data:
  dsh-home:
