name: dsh-update

# Checks the upstream git tags (deepseek-ai/deepseek-harness, prefix dsh-v) for a new dsh release and rebuilds the image
# only when that version has not been published yet (checked via the dsh-<version> tag on GHCR). Only release
# candidates and stable releases are tracked (dsh-vX.Y.Z-rc.N / dsh-vX.Y.Z) — alpha/beta prereleases are excluded on
# purpose; build those manually via the DSH_VERSION build arg if needed. Publishes `latest` + `dsh-<version>` tags.
# Release builds with semver tags stay in docker.yml. (dsh is no longer published to npm — git tags are the only
# versioned upstream artifacts.)
#
# Caveat: GitHub disables scheduled workflows after 60 days of repository
# inactivity — re-enable via the Actions tab if that happens.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dsh-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.dsh.outputs.version }}
      tag: ${{ steps.dsh.outputs.tag }}
      build: ${{ steps.dsh.outputs.build }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare latest upstream git tag against published image tags
        id: dsh
        run: |
          # Newest RC or stable dsh-v* tag by semver ordering; alpha/beta
          # prereleases are filtered out (version:refname sorts -rc.N before the
          # matching stable tag, so tail -1 picks stable when both exist).
          tag=$(git ls-remote --tags --sort='version:refname' \
                https://github.com/deepseek-ai/deepseek-harness.git 'refs/tags/dsh-v*' \
                | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                | grep -E '^dsh-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' | tail -1)
          if [ -z "$tag" ]; then
            echo "no RC or stable dsh-v* tag found" >&2
            exit 1
          fi
          version=${tag#dsh-v}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image="ghcr.io/${{ github.repository }}:dsh-${version}"
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "dsh ${version} already published (${image}) - skipping build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "dsh ${version} not yet published - building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=dsh-${{ needs.check.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DSH_VERSION=${{ needs.check.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
